name: Scrape venues

on:
  schedule:
    # Every 6 hours, offset from the top of the hour to dodge the cron rush.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Only scrape these venues (comma-separated slugs). Leave blank for all.'
        required: false
  # Schedules written into the repo (e.g. by Meta Muse from Instagram) go live
  # right away instead of waiting for the next scheduled run.
  push:
    branches: [main]
    paths: ['data/manual/**']

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A push run needs the pushed range to see which manual files changed.
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Manual files are pushed straight to main, so check them here; a bad file
      # fails this run (and emails the repo owner) instead of going live.
      - name: Validate venue data
        if: github.event_name == 'push'
        run: node scripts/validate.js

      - name: Pick venues
        id: pick
        env:
          INPUT_VENUE: ${{ inputs.venue }}
          BEFORE: ${{ github.event.before }}
        run: |
          venue="$INPUT_VENUE"
          if [ "${{ github.event_name }}" = push ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$BEFORE" HEAD -- data/manual/)
            else
              files=$(ls data/manual/*.json)
            fi
            venue=$(echo "$files" | sed -n 's#^data/manual/\(.*\)\.json$#\1#p' | paste -sd, -)
          fi
          echo "venue=$venue" >> "$GITHUB_OUTPUT"

      - name: Scrape
        if: github.event_name != 'push' || steps.pick.outputs.venue != ''
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          JAMBASE_API_KEY: ${{ secrets.JAMBASE_API_KEY }}
          VENUE: ${{ steps.pick.outputs.venue }}
        run: node scripts/scrape.js ${VENUE:+--venue "$VENUE"}

      - name: Commit data
        run: |
          git config user.name "nolatoday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update venue schedules ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Open/close scraper repair issues
        # Only the full scheduled/manual run has the complete picture.
        if: ${{ github.event_name != 'push' && !inputs.venue }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_ISSUES: 10
        run: node scripts/report-issues.js

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here.
  deploy:
    needs: scrape
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
