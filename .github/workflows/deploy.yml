name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # When called after a scrape, build the commit the scrape just pushed.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # "" on a custom domain; "/<repo>" on <user>.github.io/<repo>
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Public Mapbox token (pk.…). Set it under Settings → Secrets and variables → Actions → Variables.
          MAPBOX_TOKEN: ${{ vars.MAPBOX_TOKEN }}
        run: node scripts/build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
